name: RFP Radar

on:
  schedule:
    - cron: "0 6 * * 1-5"        # 06:00 UTC, weekdays (07:00/08:00 Berlin)
  workflow_dispatch:
    inputs:
      days:
        description: "Window in days"
        default: "3"

concurrency:
  group: rfp-radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Scan both sources and score. Pure Python, no model, no credentials.
      - name: Scan sources (Germany + TED/EU)
        run: python3 scripts/radar.py --days "${{ inputs.days || '3' }}"

      # Upsert into `rfps`. Slack is NOT posted from here: the Claude routine
      # posts through the Slack connector, so no bot or token is ever needed.
      - name: Write to Supabase
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 scripts/push_supabase.py "data/radar_$(date -u +%F).json"

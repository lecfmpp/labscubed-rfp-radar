name: RFP Radar

on:
  schedule:
    - cron: "0 6 * * 1-5"        # 06:00 UTC, weekdays (07:00/08:00 Berlin)
  workflow_dispatch:
    inputs:
      days:
        description: "Window in days"
        default: "3"

concurrency:
  group: rfp-radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    # The German export refuses connections from some cloud IP ranges. Retries
    # are bounded, but cap the job so a bad day can never hang for 20 minutes.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Scan both sources and score. Pure Python, no model, no credentials.
      - name: Scan sources (Germany + TED/EU)
        run: python3 scripts/radar.py --days "${{ inputs.days || '3' }}"

      # Upsert into `rfps`. With no Slack secret set, the digest step below only
      # prints and a Claude routine posts instead - both paths stay supported.
      - name: Write to Supabase
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 scripts/push_supabase.py "data/radar_$(date -u +%F).json"

      # Posts the digest itself, in the same job, right after the rows land -
      # so the data is guaranteed to be there and no second schedule is needed.
      # if: always() means a failed scan still gets reported in the channel.
      - name: Post RFP digest to Slack
        if: always()
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PORTAL_BASE_URL:      ${{ vars.PORTAL_BASE_URL || 'https://portal.labscubed.ca/#/sales' }}
          SLACK_WEBHOOK_URL:    ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_BOT_TOKEN:      ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL:        C0BUL9KGD52
        run: |
          # Booleans only - never echo the secret itself.
          echo "SLACK_WEBHOOK_URL present: ${{ secrets.SLACK_WEBHOOK_URL != '' }}"
          echo "SLACK_BOT_TOKEN present:   ${{ secrets.SLACK_BOT_TOKEN != '' }}"
          python3 scripts/slack_digest.py --format code
